<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bit-Clip Lab · Tooie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;600;700&family=Chivo+Mono:wght@400;500;600&display=swap">
<style>
/* Banjo-Tooie section of the Bit-Clip Lab: every level's floor cracks from the GPU census, each one tested by falling into it
   (standing still, no lag / one lag update) and, where that does not go through, by jumping onto it. Same look as the Kazooie lab. */
:root{
  --bg:#e9edeb; --panel:#fbfcfb; --sunk:#f1f4f2; --ink:#16201c; --muted:#5a6863; --line:#d3dbd7; --line-soft:#e3e8e5;
  --accent:#0f6f63; --accent-soft:#d7ebe6; --accent-ink:#ffffff;
  --c-walk:#7a35c2; --c-void:#cf3f2b; --c-lag:#d47c15; --c-jump:#1d67b0; --c-eject:#2f8a49; --c-stuck:#c2448f; --c-wall:#8a948f; --c-water:#0b7f92;
  --view:#d9dfdc; --shadow:0 6px 24px rgba(20,32,28,.14);
  --f-ui:"Chivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"Chivo Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1312; --panel:#151b19; --sunk:#111715; --ink:#e3eae6; --muted:#8d9b95; --line:#26302c; --line-soft:#1e2724;
  --accent:#43c3a5; --accent-soft:#16352e; --accent-ink:#06120f;
  --c-walk:#bd8bff; --c-void:#ff6a52; --c-lag:#ffad4d; --c-jump:#5aaeff; --c-eject:#6fd486; --c-stuck:#ff7fc4; --c-wall:#7d8a84; --c-water:#47d3ea;
  --view:#0a0e0d; --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1312; --panel:#151b19; --sunk:#111715; --ink:#e3eae6; --muted:#8d9b95; --line:#26302c; --line-soft:#1e2724;
  --accent:#43c3a5; --accent-soft:#16352e; --accent-ink:#06120f;
  --c-walk:#bd8bff; --c-void:#ff6a52; --c-lag:#ffad4d; --c-jump:#5aaeff; --c-eject:#6fd486; --c-stuck:#ff7fc4; --c-wall:#7d8a84; --c-water:#47d3ea;
  --view:#0a0e0d; --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box} html,body{height:100%} [hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.4}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:9px max(16px,env(safe-area-inset-right,0px)) 9px max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap} .brand b{font-size:16px;font-weight:700;letter-spacing:-.01em} .brand span{color:var(--muted);font-size:12.5px}
.ctl{display:flex;align-items:center;gap:7px;min-width:0}
.lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
select{font:inherit;font-size:13.5px;background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 7px;max-width:min(340px,70vw)}
a{color:var(--accent)} 
.btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn.mini{padding:2px 8px;font-size:12px;font-weight:500}
input[type=checkbox]{accent-color:var(--accent);margin:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{display:grid;grid-template-columns:minmax(0,1fr) clamp(360px,30vw,520px);min-height:0}
#view{position:relative;background:var(--view);min-height:300px;overflow:hidden}
#view canvas{display:block;width:100%;height:100%}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:15px;text-align:center;padding:16px}
.float{position:absolute;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
.legend{left:12px;top:12px;padding:8px 11px;display:grid;gap:5px;font-size:12.5px;max-width:calc(100% - 24px)}
.legend label{display:flex;align-items:center;gap:8px;cursor:pointer}
.legend .n{margin-left:auto;padding-left:10px;color:var(--muted);font-family:var(--f-mono);font-size:11.5px}
.sw{width:10px;height:10px;border-radius:50%;flex:none}
.legend .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin-top:4px}
.spot{right:12px;top:12px;width:min(380px,calc(100% - 24px));max-height:calc(100% - 60px);overflow:auto;padding:10px 12px;display:grid;gap:8px}
.spot h3{margin:0;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px} .spot h3 button{margin-left:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono);font-size:11.5px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.runs{display:flex;gap:3px;flex-wrap:wrap}
.run{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--sunk)}
.coords{background:var(--sunk);border:1px solid var(--line-soft);border-radius:8px;padding:6px 8px;display:grid;gap:4px}
.coords .ch{display:flex;gap:6px;align-items:center}.coords .ch .lbl{margin-right:auto}
.coords dd b{font-size:13px;color:var(--ink)} .bits{color:var(--muted);font-size:10.5px}
.legend{max-height:calc(100% - 24px);overflow:auto}
.legend .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--sunk)}.legend .seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;font-size:12px;padding:4px 9px;cursor:pointer}.legend .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.legend .lh{display:flex;align-items:center;gap:8px}.legend .lh b{margin-right:auto;font-size:13px}.legend .lb{display:grid;gap:5px}
.hint{right:12px;bottom:12px;font-size:11.5px;color:var(--muted);padding:5px 9px}
aside{border-left:1px solid var(--line);background:var(--panel);display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;min-width:0}
.tabs{display:flex;gap:4px;padding:8px 12px 0;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:600;font-size:13px;border:0;background:transparent;color:var(--muted);padding:7px 10px;border-bottom:2px solid transparent;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{overflow:auto;padding:12px 14px 20px;display:grid;gap:12px;align-content:start}
h2{margin:0;font-size:15px} h4{margin:4px 0 0;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
p.note{margin:0;color:var(--muted);font-size:12.5px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--sunk);border:1px solid var(--line-soft);border-radius:8px;padding:7px 9px;min-width:0}
.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums} .stat span{font-size:11.5px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:12px} th,td{padding:4px 5px;text-align:right;border-bottom:1px solid var(--line-soft);white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
td:first-child,th:first-child{text-align:left;white-space:normal}
tr.room{cursor:pointer} tr.room:hover td{background:var(--sunk)} tr.cur td{background:var(--accent-soft)}
tr.world td{font-weight:700;background:var(--panel);text-align:left;padding-top:10px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
td.pend{color:var(--muted);text-align:left}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line-soft)} .bar i{display:block;height:100%}
code{font-family:var(--f-mono);font-size:.92em}
@media (max-width:900px){.spot{top:auto;bottom:12px;right:12px;max-height:55%}main{grid-template-columns:1fr;grid-template-rows:minmax(320px,55vh) auto}aside{border-left:0;border-top:1px solid var(--line)}.pane{overflow:visible}.legend{font-size:12px}.hint{display:none}}
</style></head><body>
<div class="app">
<header>
  <div class="brand"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" rx="5" fill="var(--accent)"/><path d="M5 14.5 11 8l6 6.5" fill="none" stroke="var(--accent-ink)" stroke-width="2"/><path d="M11 8v9" stroke="var(--accent-ink)" stroke-width="2" stroke-dasharray="2 2"/></svg>
    <b>Bit-Clip Lab</b><span id="brandSub">Banjo-Tooie (USA) · every level</span></div>
  <div class="ctl"><label class="lbl" for="gameSel">Game</label><select id="gameSel" aria-label="Game" onchange="if(this.value!=='bt')location.href=this.value+'?v='+VER+location.hash.replace(/^#0x[0-9a-f]+$/i,'')"><option value="../">Banjo-Kazooie</option><option value="bt" selected>Banjo-Tooie</option></select></div>
  <script>addEventListener("pageshow",()=>{const g=document.getElementById("gameSel");if(g)g.value="bt";});</script>
  <div class="ctl"><label class="lbl" for="verSel">Version</label><select id="verSel" aria-label="Game version" title="Each version's census lives in its own repository"><option value="ntsc">N64 NTSC (USA)</option><option value="pal">N64 PAL</option><option value="xbox">Xbox</option></select></div>
  <div class="ctl"><label class="lbl" for="mapSel">Level</label><select id="mapSel" aria-label="Level"></select></div>
  <div class="ctl"><label class="lbl" for="digSel">Digits</label><select id="digSel" aria-label="Number of digits shown" title="How many digits coordinates show"><option value="0">Normal</option><option value="2">+2 decimals</option><option value="4">+4 decimals</option><option value="exact" title="9 significant figures: every f32 bit">Exact (f32)</option></select></div>
  <div class="ctl"><label class="lbl" for="viewSel">Show</label><select id="viewSel"><option value="all">All crack spots</option><option value="flat">Flat floors only</option><option value="hold">Holds only</option></select></div>
</header>
<main>
  <div id="view"><div id="loading">Loading the level list…</div>
    <div class="float legend" id="legend" hidden></div>
    <div class="float spot" id="spotCard" hidden></div>
    <div class="float hint">Drag to orbit · right-drag to pan · wheel zooms to the cursor · click a spot to fly to it · double-click to centre</div>
  </div>
  <aside>
    <div class="tabs" role="tablist"><button role="tab" id="tRoom" aria-selected="true">This level</button><button role="tab" id="tAll" aria-selected="false">All levels</button><button role="tab" id="tHow" aria-selected="false">How it was found</button></div>
    <div class="pane" id="pRoom"></div>
    <div class="pane" id="pAll" hidden></div>
    <div class="pane" id="pHow" hidden></div>
  </aside>
</main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const CATS = [
  ['walk', 'Falls through (walk in)', 'Standing still on it, Banjo falls through the floor with no lag'],
  ['lag', 'Falls through with a lag frame', 'Needs one 3-VI update while falling in (lag) to go through'],
  ['jump', 'Jump needed', 'Walking in never goes through, but landing on it from a jump does'],
  ['eject', 'Ejected', 'Banjo dips in and is pushed back up onto the floor (also after every jump tested)'],
  ['stuck', 'Stuck in the floor', 'Still sitting in the floor after 3 s (90 updates)'],
  ['wall', 'Wall pushes off', 'A wall pushes Banjo off the spot on the first update: he cannot stand on it'],
  ['water', 'Water', 'The floor ray meets water here (swimming not modelled)']];
const CVAR = { walk: '--c-walk', lag: '--c-lag', jump: '--c-jump', eject: '--c-eject', stuck: '--c-stuck', wall: '--c-wall', water: '--c-water' };
const OUT = { 0: 'through → floor below', 1: 'through → void', 2: 'ejected', 3: 'stuck', 4: 'water', 5: 'wall push' };
const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt = (n) => (n ?? 0).toLocaleString('en-US');
let INDEX = null, ROOM = null, show = { walk: 1, lag: 1, jump: 1, eject: 1, stuck: 1, wall: 0, water: 1 };
// Game versions: each version's census is its own repository's GitHub Pages site on the same kweber1.github.io address
// (bitclip-lab-tooie-us, -pal, -xbox), so each gets its own 1 GB. Links: ?v=ntsc|pal|xbox#<map>. NTSC falls back to this site's data/.
const VERS = { ntsc: { name: 'N64 NTSC (USA)', repo: 'bitclip-lab-tooie-us', local: true }, pal: { name: 'N64 PAL', repo: 'bitclip-lab-tooie-pal' }, xbox: { name: 'Xbox', repo: 'bitclip-lab-tooie-xbox' } };
let VER = (new URLSearchParams(location.search).get('v') || '').toLowerCase(); if (VER === 'us' || VER === 'usa') VER = 'ntsc';
if (!VERS[VER]) { try { VER = localStorage.getItem('bitclip-version') || ''; } catch (e) { VER = ''; } if (VER === 'us') VER = 'ntsc'; }
if (!VERS[VER]) VER = 'ntsc';
async function vfetch(name, opts, v = VER) {
  let r = null; try { r = await fetch('/' + VERS[v].repo + '/data/' + name, opts); } catch (e) {}
  if ((!r || !r.ok) && VERS[v].local) { try { r = await fetch('data/' + name, opts); } catch (e) {} }
  if (!r || !r.ok) throw new Error(r ? String(r.status) : 'offline'); return r;
}
async function loadIndex(v) { try { const r = await vfetch('index.json', { cache: 'no-cache' }, v); const j = await r.json(); return j && j.rooms && j.rooms.some(x => x.done) ? j : null; } catch (e) { return null; } }
function verUrl(m) { return location.pathname + (VER !== 'ntsc' ? '?v=' + VER : '') + (m ? '#' + m : ''); }
// collision layers (triangle classes from site_build.py: 0 floor, 1 wall, 2 ceiling, 3 water, 4 not solid for Banjo)
const LAYERS = [['floor', 'Floors', 0], ['wall', 'Walls', 1], ['ceil', 'Ceilings', 2], ['water', 'Water', 3], ['nosolid', 'Not solid for Banjo', 4]];
let layer = { floor: 1, wall: 1, ceil: 1, water: 1, nosolid: 0, back: 0, opacity: 100, draw: 'game', tex: 1, hd: 1, objs: 1, marks: 1 };   // draw: game (visible model) / coll / both
try { const l = JSON.parse(localStorage.getItem('tooie-layers') || 'null'); if (l) layer = Object.assign(layer, l); } catch (e) {}
let DIG = '0'; try { DIG = localStorage.getItem('tooie-digits') || '0'; } catch (e) {}
const f32b = new DataView(new ArrayBuffer(4));
function bitsHex(v) { f32b.setFloat32(0, v); return '0x' + f32b.getUint32(0).toString(16).toUpperCase().padStart(8, '0'); }
// a coordinate in the chosen precision; exact = the f32's shortest 9-significant-digit form (the census strings)
const f32s = (v) => String(+Math.fround(v).toPrecision(9));   // the f32's 9-significant-digit form (round-trips every bit)
function num(v) { if (DIG === 'exact') return f32s(v); const d = 2 + (+DIG); return (+v).toFixed(d); }
try { const s = JSON.parse(localStorage.getItem('tooie-show') || 'null'); if (s) show = Object.assign(show, s); } catch (e) {}

// ---- three.js scene
const view = $('view'); const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true }); renderer.setPixelRatio(Math.min(2, devicePixelRatio)); view.prepend(renderer.domElement);
renderer.localClippingEnabled = true; const clipPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1e9);   // height cut: keeps y <= cut
const scene = new THREE.Scene(); const camera = new THREE.PerspectiveCamera(50, 1, 1, 600000); camera.position.set(0, 8000, 8000);
const controls = new THREE.OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.enableZoom = false; controls.minDistance = 0.5; controls.screenSpacePanning = true;
// smooth fly-to (same as the Kazooie lab): moves the orbit centre to p, the camera keeps its direction at distance dist
let fly = null;
function flyTo(p, dist, above) { const tgt = new THREE.Vector3(p.x, p.y, p.z); const dir = camera.position.clone().sub(controls.target); if (dir.lengthSq() < 1e-6) dir.set(1, 1, 1);
  if (above) { const h = Math.hypot(dir.x, dir.z) || 1; const L = dir.length(); dir.set(dir.x / h * L * 0.6, L * 0.8, dir.z / h * L * 0.6); }   // look down at the spot from above
  const d = dist ?? dir.length(); const camEnd = tgt.clone().add(dir.normalize().multiplyScalar(d));
  fly = { t0: performance.now(), dur: matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 450, fromT: controls.target.clone(), toT: tgt, fromC: camera.position.clone(), toC: camEnd }; }
function stepFly() { if (!fly) return; const k = Math.min(1, (performance.now() - fly.t0) / fly.dur); const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
  controls.target.lerpVectors(fly.fromT, fly.toT, e); camera.position.lerpVectors(fly.fromC, fly.toC, e); if (k >= 1) fly = null; }
// what is under the cursor (mesh or spot), for zoom and double-click
function underCursor(e) { const rc = renderer.domElement.getBoundingClientRect(); const m = new THREE.Vector2(((e.clientX - rc.left) / rc.width) * 2 - 1, -((e.clientY - rc.top) / rc.height) * 2 + 1);
  const rr = new THREE.Raycaster(); rr.setFromCamera(m, camera); const td = camera.position.distanceTo(controls.target); rr.params.Points.threshold = Math.max(0.05, td / 400);
  const objs = [meshObj, ptsObj, ...(visObj ? visObj.children : [])].filter(Boolean); const hit = rr.intersectObjects(objs, false).filter(h => h.point.y <= cutY + 0.01).sort((a, b) => a.distance - b.distance)[0];
  return { hit, ray: rr.ray, td }; }
// mouse wheel zooms toward whatever is under the cursor (camera and orbit centre scale around that point)
view.addEventListener('wheel', (e) => { if (e.target !== renderer.domElement) return; e.preventDefault(); fly = null;
  const { hit, ray: rr, td } = underCursor(e); const P = hit ? hit.point.clone() : rr.at(td, new THREE.Vector3());
  let dy = e.deltaY; if (e.deltaMode === 1) dy *= 33; else if (e.deltaMode === 2) dy *= 400; dy = Math.max(-600, Math.min(600, dy));
  let k = Math.pow(1.0018, dy); const d = camera.position.distanceTo(P); if (d * k < 0.3) k = 0.3 / d; if (d * k > 500000) k = 500000 / d;
  camera.position.sub(P).multiplyScalar(k).add(P); controls.target.sub(P).multiplyScalar(k).add(P); controls.update(); }, { passive: false, capture: true });
// pinch zoom on touch screens: OrbitControls' own dolly (wheel zoom above replaces it for the mouse)
renderer.domElement.addEventListener('touchstart', (e) => { controls.enableZoom = e.touches.length > 1; }, { passive: true });
// double-click: fly to the point under the cursor and make it the orbit centre
renderer.domElement.addEventListener('dblclick', (e) => { const { hit, td } = underCursor(e); if (hit) flyTo(hit.point, Math.min(td, Math.max(60, td * 0.45))); });
let cutY = 1e9;
scene.add(new THREE.HemisphereLight(0xffffff, 0x445550, 0.62)); const dl = new THREE.DirectionalLight(0xffffff, 0.38); dl.position.set(0.4, 1, 0.3); scene.add(dl);
let meshObj = null, visObj = null, ptsObj = null, selObj = null, ptsIdx = []; let OBJS = null, objGroup = null;
function resize() { const r = view.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / Math.max(1, r.height); camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(view); resize();
(function loop() { stepFly(); controls.update(); faceCamera(); renderer.render(scene, camera); requestAnimationFrame(loop); })();
function themeColors() { scene.background = new THREE.Color(css('--view')); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { themeColors(); if (ROOM) { buildMesh(); buildPoints(); } }); themeColors();

async function gunzipJSON(buf) { const ds = new DecompressionStream('gzip'); const s = new Blob([buf]).stream().pipeThrough(ds); return JSON.parse(await new Response(s).text()); }
// textures: the Bit-Clip Lab's own paintings (tex/<key>.png), made from each original texture's colours and kind of surface only
const texCache = {}; let HD = null;   // HD: BT Reloaded (GhostlyDark) replacements, matched by GLideN64's texture checksum, loaded from the pack's repo
function labTexture(key, ws, wt) {
  const hd = layer.hd && HD && HD.files[key]; const id = key + '/' + ws + wt + (hd ? '/hd' : ''); if (texCache[id]) return texCache[id];
  const W = [THREE.RepeatWrapping, THREE.MirroredRepeatWrapping, THREE.ClampToEdgeWrapping];
  const t = new THREE.Texture(); t.flipY = false; t.wrapS = W[ws]; t.wrapT = W[wt]; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const L = new THREE.ImageLoader(); L.setCrossOrigin('anonymous'); const lab = 'tex/' + key + '.png';
  const load = (url, fb) => L.load(url, (img) => { t.image = img; t.needsUpdate = true; }, undefined, () => { if (fb) load(fb, null); });
  load(hd ? HD.base + hd.split('/').map(encodeURIComponent).join('/') : lab, hd ? lab : null);
  return (texCache[id] = t);
}
function buildVis() {
  if (visObj) { scene.remove(visObj); visObj.traverse(o => o.geometry && o.geometry.dispose()); visObj = null; }
  if (layer.draw === 'coll' || !ROOM.vis || !ROOM.vis.tris.length) return;

  const cp = (t, b) => { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => { b.textContent = 'Copied'; setTimeout(() => b.textContent = b.id === 'copyXYZ' ? 'Copy' : 'Copy exact', 1200); }).catch(() => { prompt('Copy:', t); }); };

const ray = new THREE.Raycaster(); let down = null;

function allPane() {

}
function howPane() {
  $('pHow').innerHTML = `<h2>How it was found</h2>
  <p class="note"><b>Collision.</b> Every level model (opaque and transparent) from the Banjo-Tooie (USA) ROM, read with the decomp's asset table. Objects and enemies are drawn in the view (BizHawk dump of each map) but are not part of the crack census.</p>
  <p class="note"><b>Cracks.</b> On every seam shared by two walkable floor triangles, every float along the seam (±3 floats across it) is tested with Tooie's floor ray (feet + 56 down to feet − 444, filter <code>0x400005</code>), ported exactly from <code>func_800AB0BC</code>. A crack is a float where the ray misses every triangle at the floor's height.</p>
  <p class="note"><b>Exhaustive census (levels marked “every crack float tested”).</b> Every float along every floor seam (±3 floats across), including T-junction seams where one floor edge runs along part of another, is checked with the floor ray, and <i>every</i> crack float gets all 9 fall-in runs and, when walking in does not take Banjo through, all 42 jump drops. Nothing is sampled, except that the floats within ±1 unit of 0 along a seam's long axis are left out (billions per seam there; left out by choice). Results are counted per 0.25 × 0.25 cell of each seam (floats per outcome), with one exact float of the cell's best outcome to reproduce it; cells where nothing clips are merged per 2×2 units for drawing, with their counts kept. Levels not yet redone show the earlier census (one float tested per cell).</p>
  <p class="note"><b>Falling in.</b> Banjo stands still on each crack. Then 90 updates (3 s) of falling run with Tooie's own player collision, ported from the ROM: resolver <code>func_800D4584</code>, sphere tests <code>func_800AC638/800AC978</code>, floor tracker. Timing is NTSC (1/30 s updates). One run has no lag, and eight more each have a 3-VI update on update 1 to 8. Spots that never go through also get 42 jump landings, from the apex of a tap jump (92 units) up to a full jump (174 units).</p>
  <p class="note"><b>Checked against the game.</b> In BizHawk 625 cracks in GI Basement were fallen into (bt_fallin.lua). Spots where something else moved Banjo were left out: fans, sliding on steep slopes, props. On the rest the model gives the same result update by update on 346 of 350, and the same outcome on all of them. The graphics-card build gives identical output to the CPU build.</p>
  <p class="note"><b>Not modelled.</b> Fans, conveyors and currents. Sliding on slopes steeper than about 45° (Banjo can't stand still there). Swimming. Moving platforms and props. Lag patterns other than a single 3-VI update.</p>
  <p class="note"><b>Textures.</b> The game look uses the HD replacements from <a href="https://github.com/GhostlyDark/BT-Reloaded" target="_blank" rel="noopener">BT Reloaded</a> by GhostlyDark and contributors where the pack has one (matched by GLideN64's Rice texture checksum and palette checksum; the images load from the pack's own repository). Everywhere else the textures are painted by the lab from each original texture's colours and kind of surface only — no game art is published here.</p>
  <p class="note">Source: <code>tools/tooie/</code> in this repository (tcol.h, tcensus.cu, bttex.py, btgen.py, btrice.py).</p>`;
}
